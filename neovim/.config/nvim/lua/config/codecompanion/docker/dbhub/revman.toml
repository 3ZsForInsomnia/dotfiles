# dbhub config for revman.nvim, used by the dbhub-revman catalog entry. Same
# read-only/write source pairing as plat.toml.

[[sources]]
id = "revman"
description = "revman.nvim's SQLite database, read-only"
dsn = "sqlite:///dbs/revman/revman.db"
lazy = true

[[sources]]
id = "revman_write"
description = "revman.nvim's SQLite database, with write access"
dsn = "sqlite:///dbs/revman/revman.db"
lazy = true

[[tools]]
name = "execute_sql"
source = "revman"
readonly = true
max_rows = 50

[[tools]]
name = "search_objects"
source = "revman"

[[tools]]
name = "execute_sql"
source = "revman_write"
readonly = false
max_rows = 50
